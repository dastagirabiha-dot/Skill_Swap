<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SkillSwap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-container">

  <div class="card auth-card">
    <div class="auth-header">
      <span class="logo-text serif-title" style="font-size: 2rem;">🎓 SkillSwap</span>
      <h2>Create Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Join the university skill exchange network</p>
    </div>

    <!-- Alert Banner -->
    <div id="alert-banner" class="alert-banner"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" class="form-input" placeholder="e.g. Ali" required>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">University Email</label>
        <input type="email" id="email" class="form-input" placeholder="e.g. ali@gmail.com" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="•••••••• (Min 6 characters)" required minlength="6">
      </div>

      <div class="form-group">
        <label for="department" class="form-label">Department / Major</label>
        <select id="department" class="form-select" required>
          <option value="" disabled selected>Select Department</option>
          <option value="CS">Computer Science</option>
          <option value="SE">Software Engineering</option>
          <option value="AI">Artificial Intelligence</option>
          <option value="IT">Information Technology</option>
          <option value="EE">Electrical Engineering</option>
          <option value="BBA">Business Administration</option>
        </select>
      </div>

      <div class="form-group">
        <label for="phonenumber" class="form-label">Phone Number (Optional)</label>
        <input type="tel" id="phonenumber" class="form-input" placeholder="e.g. 03001234567">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log In Here</a>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
