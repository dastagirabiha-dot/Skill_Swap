<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SkillSwap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-container">

  <div class="card auth-card">
    <div class="auth-header">
      <span class="logo-text serif-title" style="font-size: 2rem;">🎓 SkillSwap</span>
      <h2>Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Sign in to trade academic skills</p>
    </div>

    <!-- Alert Banner -->
    <div id="alert-banner" class="alert-banner alert-banner-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email" class="form-label">University Email</label>
        <input type="email" id="email" class="form-input" placeholder="e.g. ali@gmail.com" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Log In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Register Here</a>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
